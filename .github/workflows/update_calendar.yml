name: Generate World Cup Calendar

on:
  # 1. 定时触发：每天 UTC 00:00 运行（相当于北京时间早上 08:00）
  schedule:
    - cron: '0 0 * * *'
  # 2. 允许手动触发：方便你在 GitHub 网页上随时点击测试
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 赋予自动提交代码的权限

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装你代码中用到的第三方库
        pip install requests icalendar pytz

    - name: Run Python script
      run: python main.py  # 运行你的脚本

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add worldcup2026.ics
        
        # 检查文件是否有更新，如果有更新才 commit 和 push，避免产生无意义的空提交
        if [[ -n $(git status -s) ]]; then
          git commit -m "🏆 Auto-update worldcup2026.ics"
          git push
        else
          echo "No changes to commit."
        fi
